<article class="wrap section material-detail">
  <a class="text-link back-link" href="@base@materiais/">Voltar aos materiais</a>
  <div class="material-layout">
    <div class="cover material-cover @color@" aria-hidden="true">
      <div class="mini-sheet"><strong>@art@</strong><small>@kind@</small></div>
    </div>
    <div class="material-description">
      <p class="label">@category@ · @kind@</p>
      <h1>@material-title@</h1>
      <p class="material-author">Por <a href="@author-link@">@author@</a></p>
      <p class="material-summary">@summary@</p>
      <div class="material-access">
        @access@
      </div>
      <button class="text-link" type="button" data-report>Simular denúncia</button>
    </div>
  </div>
</article>
