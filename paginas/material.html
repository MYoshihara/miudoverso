<article class="wrap section material-detail">
  <a class="text-link back-link" href="@base@materiais/">Voltar aos materiais</a>
  <div class="material-layout">
    <div class="cover material-cover @color@" aria-hidden="true">
      <div class="mini-sheet"><strong>@art@</strong><small>@kind@</small></div>
    </div>
    <div class="material-description">
      <p class="label">@category@ · @kind@</p>
      <h1>@material-title@</h1>
      <p class="material-author">Por <a href="@author-link@">@author@</a></p>
      <p class="material-summary">@summary@</p>
      <div class="material-access">
        @access@
      </div>
      <div class="material-secondary">
        <button class="button outlined save-toggle" type="button" data-save="@id@" aria-pressed="false" aria-label="Salvar material">@bookmark@<span class="save-off">Salvar material</span><span class="save-on">Material salvo</span></button>
        <button class="text-link report-link" type="button" data-report>Simular denúncia</button>
      </div>
    </div>
  </div>
</article>
<section class="wrap section related" aria-labelledby="related-title">
  <div class="section-head"><div><h2 id="related-title">Outros materiais</h2></div><a class="text-link" href="@base@materiais/">Ver catálogo completo</a></div>
  <div class="grid">@related@</div>
</section>
