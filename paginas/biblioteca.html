<div class="wrap section library" id="biblioteca">
  <header class="library-hero">
    <h1>Bibliotecas</h1>
    <p class="lede">Baixe imagens e sons gratuitos para criar jogos de linguagem, cartões e atividades de escuta.</p>
    <div class="actions">
      <a class="button primary" href="#imagens">Ver imagens</a>
      <a class="button outlined" href="#sons">Explorar sons</a>
    </div>
  </header>

  <section class="library-section" id="imagens" aria-labelledby="imagens-titulo">
    <h2 id="imagens-titulo">Imagens</h2>
    <div class="grid">@images@</div>
  </section>

  <section class="library-section" id="sons" aria-labelledby="sons-titulo">
    <h2 id="sons-titulo">Sons</h2>
    <div class="grid">@sounds@</div>
  </section>
</div>
