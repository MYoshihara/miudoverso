<article class="professional">
  <header class="conecta professional-hero">
    <div class="wrap professional-header">
      <a class="text-link back-link" href="@base@conecta/">Voltar ao Conecta</a>
      <div class="professional-overview">
        <div>
          <div class="professional-identity">
            <span class="avatar @color@" aria-hidden="true">@initials@</span>
            <div>
              <h1>@name@</h1>
              <div class="professional-byline">
                <p class="label">@role@</p>
                <p class="demo">Perfil fictício</p>
              </div>
            </div>
          </div>
          <p class="professional-bio">@bio@</p>
        </div>
        @main-action@
      </div>
    </div>
  </header>
  @section-links@
  @details@
</article>
